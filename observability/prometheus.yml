global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    site: aipnt

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          node: aipnt

  - job_name: nvidia-gpu
    static_configs:
      - targets:
          - dcgm-exporter:9400
        labels:
          node: aipnt
